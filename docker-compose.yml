services:
  app-dev:
    build: .
    container_name: cosmos-tech-app
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - dev
    networks:
      - cosmos-network

  app-prod:
    build: .
    container_name: cosmos-tech-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - prod
    networks:
      - cosmos-network

  mysql:
    image: mysql:8.0
    container_name: cosmos-tech-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cosmos_dev_123
      MYSQL_DATABASE: cosmos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcosmos_dev_123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev
    networks:
      - cosmos-network

volumes:
  mysql_data:

networks:
  cosmos-network:
    driver: bridge
